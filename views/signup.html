    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup Page</title>
   <link rel="stylesheet"  href="css/signup.css">
</head>
<body>

  <div class="container">
    <h2>Signup</h2>
    
    <form onsubmit="signup(event)">
        <label for="username" >Full Name: </label>
      <input type="text" placeholder="Full Name" name="username" id="username" required>
      <label for="email">Email:</label>
      <input type="email" placeholder="Email"  id="email" name="email" required>
      <label for="phone-number">Phone Number:</label>
      <input type="number" id="phone-number" name="phoneNumber">
      <label for="password">Password:</label>

      <input type="password" placeholder="Password" name="password" id="password" required>
      
      
      <button type="submit">Sign Up:</button>
    </form>

    <div class="link">
 <h4 style="color: red;" id="alert-msg"></h4>
        <p>Already have an account? <a href="/login">Login</a></p>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" referrerpolicy="no-referrer"></script>
<script src="js/signup.js"></script>
</body>
</html>
